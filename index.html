<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片坐标拾取工具</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8eb; --muted:#9aa3af; --accent:#4f8cff; --accent2:#6ee7a0;
    --danger:#ff6470; --warn:#ffc079;
  }
  :root.light{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef0f3; --border:#d0d4dc;
    --text:#1a1d23; --muted:#6b7280; --accent:#4f8cff; --accent2:#10b981;
    --danger:#e74c3c; --warn:#f59e0b;
  }
  .icon-btn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; padding:4px 6px; line-height:1; border-radius:6px; transition:color .15s; display:inline-flex; align-items:center}
  button.icon-btn:hover{color:var(--accent); border-color:transparent}
  :root.light button.icon-btn:hover{color:var(--accent)}
  .icon-btn .icon-sun{display:none}
  :root.light .icon-btn .icon-moon{display:none}
  :root.light .icon-btn .icon-sun{display:block}
  .app-title{font-size:16px; font-weight:600; color:var(--text)}
  .app-sub{font-size:13px; color:var(--muted)}
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
  }
  .app{display:flex; flex-direction:column; height:100vh}
  header{
    display:flex; align-items:center; gap:16px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  header h1{font-size:16px; margin:0; font-weight:600}
  .spacer{flex:1}
  button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:all .15s;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:#fff}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  button.danger:hover{border-color:var(--danger); color:var(--danger)}
  .main{flex:1; display:flex; min-height:0}
  .thumbs{
    width:180px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; flex-shrink:0; transition:width .15s;
    position:relative;
  }
  .thumbs.collapsed{width:0; border-right:none; overflow:visible}
  .thumbs.collapsed .thumbList{display:none}
  .thumbs.collapsed .thumbsHead{visibility:hidden}
  .thumbs.collapsed #thumbsToggle{
    visibility:visible; position:absolute; right:-28px; top:10px;
    background:var(--panel); border:1px solid var(--border); border-left:none;
    border-radius:0 8px 8px 0; padding:8px 6px; z-index:10; width:28px; text-align:center;
  }
  .thumbsHead{
    display:flex; align-items:center; gap:6px; padding:10px; border-bottom:1px solid var(--border);
    font-size:12px; font-weight:600; color:var(--muted); flex-shrink:0;
  }
  .thumbsHead .spacer{flex:1}
  #thumbsToggle, .thumb-del{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 2px; line-height:1;
  }
  #thumbsToggle:hover{color:#fff}
  .thumbList{flex:1; overflow-y:auto; padding:8px; min-height:0}
  .thumb{
    display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px;
    border:1px solid var(--border); margin-bottom:6px; cursor:pointer; background:var(--panel2);
    transition:border-color .15s;
  }
  .thumb:hover{border-color:var(--accent)}
  .thumb.active{border-color:var(--accent); background:rgba(79,140,255,.12)}
  .thumb img{width:44px; height:44px; object-fit:cover; border-radius:6px; background:var(--bg); flex-shrink:0}
  .thumb .tinfo{min-width:0; flex:1}
  .thumb .tname{font-size:11px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .thumb .tcount{font-size:10px; color:var(--muted)}
  .thumb .thumb-del{flex-shrink:0}
  .thumb .thumb-del:hover{color:var(--danger)}
  .left{flex:1; display:flex; flex-direction:column; min-width:0}
  #stageWrap{
    flex:1; position:relative; overflow:auto; background:
      repeating-conic-gradient(#14161a 0% 25%, #101216 0% 50%) 0 0/24px 24px;
    display:flex; align-items:center; justify-content:center;
  }
  :root.light #stageWrap{background:repeating-conic-gradient(#e6e8ec 0% 25%, #eef0f3 0% 50%) 0 0/24px 24px}
  #stageWrap.drag-over::after{
    content:'📁 拖放图片到此处'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(79,140,255,.2); backdrop-filter:blur(4px);
    font-size:24px; font-weight:600; color:#fff; z-index:50;
    border:3px dashed var(--accent); pointer-events:none;
  }
  #stage{position:relative; display:inline-block}
  #stageInner{position:relative}
  #imgCanvas{display:block; max-width:none}
  #overlay{position:absolute; inset:0; pointer-events:none}
  /* handle placement: overlay is inset:0 of stageInner which wraps the canvas */
  .magnifier{
    position:absolute; width:120px; height:120px; border:2px solid var(--accent);
    border-radius:8px; background:#000; box-shadow:0 4px 20px rgba(0,0,0,.6);
    display:none; pointer-events:none; z-index:20; overflow:hidden;
  }
  .magnifier canvas{width:120px; height:120px; image-rendering:pixelated}
  .mag-label{
    position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.7);
    font-size:11px; font-family:Consolas,monospace; padding:2px 4px; text-align:center;
  }
  #toolbar{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; flex-wrap:wrap;
  }
  .tool{display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--border); cursor:pointer; font-size:13px; background:var(--panel2); user-select:none}
  .tool.active{border-color:var(--accent); color:#fff; background:rgba(79,140,255,.15)}
  .tool .dot{width:10px; height:10px; border-radius:50%; background:var(--muted)}
  .tool.active .dot{background:var(--accent)}
  .hint{font-size:12px; color:var(--muted)}
  .right{
    width:360px; background:var(--panel); border-left:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  .right h2{font-size:13px; margin:0; padding:12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:8px}
  .right h2 .count{background:var(--accent); color:#fff; border-radius:20px; padding:0 8px; font-size:12px}
  #list{flex:1; overflow-y:auto; padding:8px}
  .item{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:8px; margin-bottom:8px;
  }
  .item .line{display:flex; align-items:center; gap:6px; margin-bottom:6px}
  .item .badge{font-size:11px; padding:2px 7px; border-radius:4px; font-weight:600}
  .badge.point{background:rgba(79,140,255,.2); color:var(--accent)}
  .badge.box{background:rgba(110,231,160,.2); color:var(--accent2)}
  .item .coords{font-family:Consolas,monospace; font-size:12px; color:var(--muted); flex:1; word-break:break-all}
  .item .del{margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px}
  .item .del:hover{color:var(--danger)}
  .item input[type=text]{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:13px; outline:none;
  }
  .item input[type=text]:focus{border-color:var(--accent)}
  .item .meta{font-size:11px; color:var(--muted); margin-top:4px; font-family:Consolas,monospace}
  .item.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .group-head{display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:12px; font-weight:600; color:var(--muted); margin-top:6px}
  .group-head .gcount{background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:0 7px; font-size:11px}
  .right .actions{padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap}
  textarea{
    width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px; font-size:12px; font-family:Consolas,monospace;
    resize:vertical; min-height:120px; outline:none; white-space:pre;
  }
  textarea:focus{border-color:var(--accent)}
  .seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
  .seg button{border:none; border-radius:0; padding:6px 10px; font-size:12px; background:var(--panel2)}
  .seg button.on{background:var(--accent); color:#fff}
  .empty{padding:20px; text-align:center; color:var(--muted); font-size:13px}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#222; border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:8px; font-size:13px; z-index:100;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{opacity:1}
  .edit-input{
    position:absolute; z-index:30; background:var(--panel); border:1px solid var(--accent);
    color:var(--text); border-radius:6px; padding:4px 8px; font-size:13px; outline:none;
    min-width:80px; max-width:200px; display:none;
  }
  .edit-input:focus{border-color:var(--accent2)}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:#333; border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
  .nummode{font-size:12px; color:var(--accent2); font-family:Consolas,monospace}
  .gh-link{display:inline-flex; align-items:center; gap:4px; color:var(--muted); text-decoration:none; font-size:13px; font-weight:500; margin-right:4px; transition:color .15s}
  .gh-link:hover{color:#fff}
  .gh-icon{display:inline-flex; color:var(--muted); transition:color .15s}
  .gh-icon:hover{color:#fff}
  :root.light .gh-link:hover{color:#000}
  :root.light .gh-icon:hover{color:#000}
  #langSel{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; outline:none}
  #langSel:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="https://github.com/BerryUIKI" target="_blank" title="BerryUIKI" class="gh-link" style="font-size:16px;font-weight:600"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true" style="margin-right:4px"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>BerryUIKI</a>
    <span class="app-title" data-i18n="title">图片坐标拾取工具</span>
    <span class="app-sub" data-i18n="hintTop">点选 / 框选 · 像素 + 百分比输出</span>
    <div class="spacer"></div>
    <a href="https://github.com/BerryUIKI/ImgCoordPicker" target="_blank" title="GitHub 仓库" class="gh-icon">
      <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button id="themeBtn" title="切换主题" class="icon-btn">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-15a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 1 1-1.42 1.41L4.22 5.64a1 1 0 0 1 0-1.42zM18.36 18.36a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 1 1-1.42 1.41l-1.41-1.42a1 1 0 0 1 0-1.41zM1 12a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H2a1 1 0 0 1-1-1zm18 0a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.41l1.42-1.42a1 1 0 1 1 1.41 1.42l-1.42 1.41a1 1 0 0 1-1.41 0zm14.14-14.14a1 1 0 0 1 0-1.41l1.42-1.42a1 1 0 1 1 1.41 1.42l-1.42 1.41a1 1 0 0 1-1.41 0z"/></svg>
    </button>
    <select id="langSel" title="Language / 语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <button id="uploadBtn" class="primary" data-i18n="upload">📁 上传图片</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button id="resetBtn" data-i18n="reset">🗑️ 清空标注</button>
  </header>

<div class="main">
	    <div class="thumbs" id="thumbsPanel">
	      <div class="thumbsHead">
	        <span data-i18n="thumbsTitle">📷 图集</span> <span class="count" id="thumbsCount">0</span>
	        <div class="spacer"></div>
	        <button id="thumbsToggle" title="折叠">◀</button>
	      </div>
	      <div class="thumbList" id="thumbList"></div>
	    </div>
	    <div class="left">
      <div id="stageWrap">
        <div id="stage">
          <div id="stageInner">
            <canvas id="imgCanvas"></canvas>
            <svg id="overlay">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
          </div>
        </div>
        <div class="magnifier" id="magnifier">
          <canvas id="magCanvas" width="120" height="120"></canvas>
          <div class="mag-label" id="magLabel"></div>
        </div>
        <input type="text" id="editInput" class="edit-input" data-i18n-placeholder="inputPlaceholder" placeholder="输入提示词 / 文字…">
      </div>
      <div id="toolbar">
        <div class="tool active" id="toolAuto">
          <span class="dot"></span> <span data-i18n="autoMode">自动模式</span>
        </div>
        <div class="seg" style="margin-left:8px" id="modeSeg">
          <button data-mode="pct" class="on" data-i18n="pct">百分比</button>
          <button data-mode="both" data-i18n="both">像素+百分比</button>
        </div>
        <span class="hint" id="toolHint" data-i18n="hintTool">单击＝点选 · 长按拖动＝框选</span>
        <div class="spacer"></div>
        <div class="tool" id="gridToggle" title="网格辅助线">
          <span class="dot"></span> <span data-i18n="grid">⧉ 网格</span>
        </div>
        <button id="fitBtn" data-i18n="fitBtn" title="尺寸自适应">⤢ 适应</button>
        <span class="hint" style="margin-left:4px" data-i18n="zoomHint">缩放：Ctrl+滚轮</span>
      </div>
    </div>

    <div class="right">
      <h2><span data-i18n="listTitle">标注列表</span> <span class="count" id="count">0</span></h2>
      <div style="padding:6px 12px; border-bottom:1px solid var(--border); display:flex; gap:6px; align-items:center">
        <span style="font-size:11px; color:var(--muted)" data-i18n="groupLabel">分组：</span>
        <div class="seg" id="groupSeg">
          <button data-group="none" class="on" data-i18n="groupNone">不分组</button>
          <button data-group="type" data-i18n="groupType">按类型分组</button>
        </div>
      </div>
      <div id="list"></div>
      <div class="actions">
        <button id="exportBtn" title="导出标注 JSON">⬇️ <span data-i18n="export">导出</span></button>
        <button id="importBtn" title="导入标注 JSON">⬆️ <span data-i18n="import">导入</span></button>
        <button id="addManualBtn" data-i18n="addManual">➕ 手动添加</button>
      </div>
      <div style="padding:0 12px 8px; display:flex; gap:8px; border-top:1px solid var(--border); padding-top:8px">
        <button id="copyBtn" class="primary" data-i18n="copy" style="flex:1; padding:10px 18px; font-size:14px; font-weight:600">📋 复制结果</button>
        <button id="clearBtn" class="danger" data-i18n="clear" style="padding:10px 12px; font-size:13px; flex-shrink:0">🧹 清空</button>
      </div>
      <input type="file" id="importInput" accept=".json,application/json" hidden>
      <div style="padding:8px 12px 0; border-top:1px solid var(--border); display:flex; align-items:center; gap:8px">
        <span style="font-size:11px; color:var(--muted); flex-shrink:0" data-i18n="formatLabel">格式：</span>
        <select id="formatSel" style="flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 6px; font-size:12px; outline:none">
          <option value="text" data-i18n="fmtText">📄 文本</option>
          <option value="json" data-i18n="fmtJson">🧩 JSON</option>
          <option value="svg" data-i18n="fmtSvg">🖼️ SVG</option>
          <option value="comfy" data-i18n="fmtComfy">🤖 ComfyUI/SD</option>
          <option value="coco" data-i18n="fmtCoco">🎯 COCO</option>
        </select>
      </div>
      <div style="max-height:120px; overflow:hidden; border-top:1px solid var(--border)">
        <textarea id="output" data-i18n-placeholder="outputPlaceholder" placeholder="输出结果将显示在这里…" readonly></textarea>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  // ---------- refs ----------
  const $ = id => document.getElementById(id);
  const fileInput=$('fileInput'), uploadBtn=$('uploadBtn'), resetBtn=$('resetBtn');
  const imgCanvas=$('imgCanvas'), overlay=$('overlay'), stage=$('stage'), stageWrap=$('stageWrap'), stageInner=$('stageInner');
  const magnifier=$('magnifier'), magCanvas=$('magCanvas'), magLabel=$('magLabel');
  const toolAuto=$('toolAuto'), modeSeg=$('modeSeg');
  const listEl=$('list'), output=$('output'), countEl=$('count');
  const toolHint=$('toolHint'), toast=$('toast'), fitBtn=$('fitBtn');
  const editInput=$('editInput');

  // ---------- state ----------
  let images=[];                       // [{id,name,img,annotations,nextId,thumbnail,scale,lastLayout}]
  let currentImageId=null;
  let img=null;                        // alias for current image's img (kept for minimal code changes)
  let scale=1;
  let mode='pct';                      // pct | both
  const NS='http://www.w3.org/2000/svg';
  let annotations=[];                  // alias for current image's annotations
  let nextId=1;                        // alias for current image's nextId
  let dragState=null;                  // {startX,startY,startTime,active,dx,dy}
  let draftRect=null;                  // svg rect for box draft
  let draftLabel=null;                 // svg text for box size label during drag
  let hoverPx=null;                    // {x,y} canvas px for magnifier
  let lastLayout=null;
  let thumbsCollapsed=false;
  let history=[];                      // undo stack [{annotations,nextId}]
  let redoStack=[];                    // redo stack
  let selectedAnnotationId=null;       // currently selected annotation id
  let showGrid=false;                  // grid helper lines toggle
  let snappingActive=false;            // shift key snapping state
  let groupingMode='none';             // 'none' | 'type'
  const HISTORY_LIMIT=50;
  const DRAG_THRESHOLD=5;              // px movement to trigger box mode
  const CLICK_MAX_MS=250;              // max mousedown-to-mouseup time for a click

  // ---------- multi-image helpers ----------
  function getCurrentImage(){
    return images.find(im=>im.id===currentImageId) || null;
  }
  function saveCurrentState(){
    const ci=getCurrentImage();
    if(!ci) return;
    ci.annotations=annotations;
    ci.nextId=nextId;
    ci.scale=scale;
    ci.lastLayout=lastLayout;
  }
  function loadImageState(id){
    const im=images.find(x=>x.id===id);
    if(!im) return;
    currentImageId=id;
    img=im.img;
    annotations=im.annotations;
    nextId=im.nextId;
    scale=im.scale||1;
    lastLayout=im.lastLayout||null;
  }
  function switchImage(id){
    saveCurrentState();
    loadImageState(id);
    layout();
    renderList();
    updateOutput();
    renderThumbs();
  }

  // ---------- undo / redo ----------
  function pushHistory(){
    history.push(JSON.parse(JSON.stringify({annotations, nextId})));
    if(history.length>HISTORY_LIMIT) history.shift();
    redoStack=[];
  }
  function applyState(snap){
    annotations.length=0;
    snap.annotations.forEach(a=>annotations.push(a));
    nextId=snap.nextId;
    saveCurrentState();
    render(); renderList(); updateOutput();
  }
  function undo(){
    if(!history.length){ toastMsg(i18n[currentLang].noUndo); return; }
    const snap=history.pop();
    redoStack.push(JSON.parse(JSON.stringify({annotations, nextId})));
    applyState(snap);
    toastMsg(i18n[currentLang].undoToast);
  }
  function redo(){
    if(!redoStack.length){ toastMsg(i18n[currentLang].noRedo); return; }
    const snap=redoStack.pop();
    history.push(JSON.parse(JSON.stringify({annotations, nextId})));
    applyState(snap);
    toastMsg(i18n[currentLang].redoToast);
  }
  function addImage(file, im){
    const id='img_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    const name=file.name;
    // generate thumbnail
    const c=document.createElement('canvas');
    const max=80;
    const s=Math.min(max/im.naturalWidth, max/im.naturalHeight, 1);
    c.width=im.naturalWidth*s; c.height=im.naturalHeight*s;
    const ctx=c.getContext('2d');
    ctx.drawImage(im,0,0,c.width,c.height);
    const thumbnail=c.toDataURL('image/jpeg',0.7);
    const entry={id, name, img:im, annotations:[], nextId:1, thumbnail, scale:1, lastLayout:null};
    images.push(entry);
    saveCurrentState();
    loadImageState(id);
    imgCanvas.width=im.naturalWidth;
    imgCanvas.height=im.naturalHeight;
    const ctx2=imgCanvas.getContext('2d');
    ctx2.drawImage(im,0,0);
    renderThumbs();
    return entry;
  }
  function removeImage(id){
    if(images.length<=1){ toastMsg(i18n[currentLang].cantRemoveLast); return; }
    const idx=images.findIndex(x=>x.id===id);
    if(idx===-1) return;
    images.splice(idx,1);
    if(currentImageId===id){
      const next=images[Math.min(idx,images.length-1)];
      loadImageState(next.id);
      imgCanvas.width=next.img.naturalWidth;
      imgCanvas.height=next.img.naturalHeight;
      const ctx=imgCanvas.getContext('2d');
      ctx.drawImage(next.img,0,0);
      requestAnimationFrame(()=>requestAnimationFrame(fitToView));
    }
    renderThumbs();
    renderList();
    updateOutput();
  }

  // ---------- thumbs rendering ----------
  function renderThumbs(){
    const el=$('thumbList');
    el.innerHTML='';
    $('thumbsCount').textContent=images.length;
    images.forEach(im=>{
      const div=document.createElement('div');
      div.className='thumb'+(im.id===currentImageId?' active':'');
      const imgEl=document.createElement('img');
      imgEl.src=im.thumbnail; imgEl.alt=im.name;
      const info=document.createElement('div'); info.className='tinfo';
      const nameEl=document.createElement('div'); nameEl.className='tname'; nameEl.textContent=im.name;
      const countEl=document.createElement('div'); countEl.className='tcount'; countEl.textContent=im.annotations.length+' 标注';
      info.append(nameEl, countEl);
      const del=document.createElement('button'); del.className='thumb-del'; del.textContent='✕';
      del.title='删除图片';
      del.onclick=e=>{ e.stopPropagation(); removeImage(im.id); };
      div.append(imgEl, info, del);
      div.onclick=()=>{ if(im.id!==currentImageId) switchImage(im.id); };
      el.appendChild(div);
    });
  }

  // ---------- image loading ----------
  function loadFiles(files){
    if(!files||!files.length) return;
    const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
    if(!list.length){ toastMsg(i18n[currentLang].dropFile); return; }
    list.forEach((file,idx)=>{
      const url=URL.createObjectURL(file);
      const im=new Image();
      im.onload=()=>{
        addImage(file, im);
        if(idx===list.length-1 || !img){
          switchImage(images[images.length-1].id);
          imgCanvas.width=im.naturalWidth;
          imgCanvas.height=im.naturalHeight;
          const ctx=imgCanvas.getContext('2d');
          ctx.drawImage(im,0,0);
          requestAnimationFrame(()=>requestAnimationFrame(fitToView));
          toastMsg(i18n[currentLang].loadSuccess + im.naturalWidth +' × '+ im.naturalHeight);
        }
      };
      im.src=url;
    });
  }
  uploadBtn.onclick=()=>fileInput.click();
  fileInput.onchange=e=>loadFiles(e.target.files);

  // ---------- drag & drop ----------
  stageWrap.addEventListener('dragenter', e=>{ e.preventDefault(); stageWrap.classList.add('drag-over'); });
  stageWrap.addEventListener('dragover', e=>{ e.preventDefault(); stageWrap.classList.add('drag-over'); });
  stageWrap.addEventListener('dragleave', e=>{ e.preventDefault(); stageWrap.classList.remove('drag-over'); });
  stageWrap.addEventListener('drop', e=>{
    e.preventDefault();
    stageWrap.classList.remove('drag-over');
    loadFiles(e.dataTransfer.files);
  });

  // ---------- layout / zoom / fit ----------
  function fitToView(){
    if(!img) return;
    const wrap=stageWrap.getBoundingClientRect();
    const pad=20;
    const sw=wrap.width-pad*2, sh=wrap.height-pad*2;
    if(sw<=0||sh<=0){ scale=1; layout(); return; }
    scale=Math.min(sw/img.naturalWidth, sh/img.naturalHeight, 1);
    layout();
    stageWrap.scrollLeft=0; stageWrap.scrollTop=0;
  }
  function layout(){
    if(!img) return;
    const w=img.naturalWidth*scale, h=img.naturalHeight*scale;
    stageInner.style.width=w+'px';
    stageInner.style.height=h+'px';
    // scale the canvas display size (buffer stays at natural resolution for crisp rendering)
    imgCanvas.style.width=w+'px';
    imgCanvas.style.height=h+'px';
    // overlay SVG uses CSS inset:0 to fill stageInner; viewBox maps coordinates
    overlay.style.width=w+'px';
    overlay.style.height=h+'px';
    overlay.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    lastLayout={w,h};
    render();
  }
  function zoomAt(factor, cx, cy){
    if(!img) return;
    const r=stageWrap.getBoundingClientRect();
    const mw=stageInner.getBoundingClientRect();
    const px=(cx - r.left) - (mw.left - r.left);
    const py=(cy - r.top) - (mw.top - r.top);
    const old=scale;
    let ns=Math.min(40, Math.max(0.05, old*factor));
    scale=ns;
    layout();
    // keep point under cursor stable
    const nw=stageInner.getBoundingClientRect();
    const nx=(px/old)*ns;
    const ny=(py/old)*ns;
    stageWrap.scrollLeft += (nw.left-r.left) - ((mw.left-r.left) + (px - nx));
    stageWrap.scrollTop  += (nw.top-r.top)  - ((mw.top-r.top)  + (py - ny));
  }
  stageWrap.addEventListener('wheel', e=>{
    if(!img) return;
    e.preventDefault();
    if(e.ctrlKey){
      const r=stageWrap.getBoundingClientRect();
      zoomAt(e.deltaY<0?1.15:1/1.15, e.clientX, e.clientY);
    } else {
      // allow normal scroll
    }
  }, {passive:false});

  // ---------- canvas coordinate helpers ----------
  function eventToCanvas(e){
    const r=stageInner.getBoundingClientRect();
    const x=(e.clientX-r.left)/scale;
    const y=(e.clientY-r.top)/scale;
    return {x, y};
  }
  function canvasToStage(x,y){
    const r=stageInner.getBoundingClientRect();
    return {sx:x*scale + r.left, sy:y*scale + r.top};
  }

  // ---------- rendering annotations ----------
  // draw a label pill (colored background + text) at a canvas position
  function drawLabel(cx, cy, text, color, anchor){
    const g=document.createElementNS(NS,'g');
    const t=document.createElementNS(NS,'text');
    const fs=16;
    t.setAttribute('font-size',fs);
    t.setAttribute('font-weight','600');
    t.setAttribute('fill','#fff');
    t.setAttribute('x',cx); t.setAttribute('y',cy);
    if(anchor==='end') t.setAttribute('text-anchor','end');
    t.textContent=text;
    // measure
    overlay.appendChild(t);
    const bb=t.getBBox();
    overlay.removeChild(t);
    const pad=4;
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',bb.x-pad); r.setAttribute('y',bb.y-pad);
    r.setAttribute('width',bb.width+pad*2); r.setAttribute('height',bb.height+pad*2);
    r.setAttribute('rx',5); r.setAttribute('ry',5);
    r.setAttribute('fill',color);
    r.setAttribute('stroke','rgba(0,0,0,.6)'); r.setAttribute('stroke-width','1');
    g.appendChild(r);
    g.appendChild(t);
    overlay.appendChild(g);
  }

  function render(){
    overlay.innerHTML='';
    // draw grid if enabled
    if(showGrid && img){
      const W=img.naturalWidth, H=img.naturalHeight;
      const steps=10;
      for(let i=1;i<steps;i++){
        const x=W*i/steps, y=H*i/steps;
        const l1=document.createElementNS(NS,'line');
        l1.setAttribute('x1',x); l1.setAttribute('y1',0);
        l1.setAttribute('x2',x); l1.setAttribute('y2',H);
        l1.setAttribute('stroke','rgba(255,255,255,.12)'); l1.setAttribute('stroke-width','1');
        overlay.appendChild(l1);
        const l2=document.createElementNS(NS,'line');
        l2.setAttribute('x1',0); l2.setAttribute('y1',y);
        l2.setAttribute('x2',W); l2.setAttribute('y2',y);
        l2.setAttribute('stroke','rgba(255,255,255,.12)'); l2.setAttribute('stroke-width','1');
        overlay.appendChild(l2);
      }
    }
    for(const a of annotations){
      const isSel=a.id===selectedAnnotationId;
      if(a.type==='point'){
        const circ=document.createElementNS(NS,'circle');
        circ.setAttribute('cx',a.x); circ.setAttribute('cy',a.y);
        const r=isSel?7:4.5;
        circ.setAttribute('r',r); circ.setAttribute('fill','#ff4d6d'); circ.setAttribute('stroke','#fff');
        circ.setAttribute('stroke-width',isSel?3:1.5);
        if(isSel) circ.setAttribute('filter','url(#glow)');
        overlay.appendChild(circ);
        drawLabel(a.x+8, a.y+16, '#'+a.id, 'rgba(255,77,109,.92)', 'start');
      } else {
        const rect=document.createElementNS(NS,'rect');
        rect.setAttribute('x',a.x); rect.setAttribute('y',a.y);
        rect.setAttribute('width',a.w); rect.setAttribute('height',a.h);
        rect.setAttribute('fill','rgba(110,231,160,.15)');
        const sw=isSel?3:1.5;
        rect.setAttribute('stroke','#6ee7a0'); rect.setAttribute('stroke-width',sw);
        if(isSel) rect.setAttribute('filter','url(#glow)');
        overlay.appendChild(rect);
        drawLabel(a.x, Math.max(20,a.y-8), '#'+a.id, 'rgba(110,231,160,.92)', 'start');
      }
    }
  }

  // ---------- magnifier ----------
  function moveMagnifier(e){
    if(!img){ magnifier.style.display='none'; return; }
    const pt=eventToCanvas(e);
    hoverPx={x:Math.round(pt.x), y:Math.round(pt.y)};
    const r=stageWrap.getBoundingClientRect();
    let mx=e.clientX-r.left+16, my=e.clientY-r.top+16;
    if(mx+120>r.width) mx=e.clientX-r.left-136;
    if(my+120>r.height) my=e.clientY-r.top-136;
    magnifier.style.left=mx+'px'; magnifier.style.top=my+'px';
    magnifier.style.display='block';
    const ctx=magCanvas.getContext('2d');
    ctx.imageSmoothingEnabled=false;
    ctx.clearRect(0,0,120,120);
    const src=img.naturalWidth;
    const z=10;
    const half=60/z;
    ctx.drawImage(imgCanvas,
      Math.max(0,Math.min(src-0.5, pt.x-half)), Math.max(0,Math.min(img.naturalHeight-0.5, pt.y-half)),
      half*2, half*2, 0,0,120,120);
    magLabel.textContent=`${hoverPx.x}, ${hoverPx.y}`;
  }
  function hideMagnifier(){ if(dragState && dragState.active) return; magnifier.style.display='none'; }

  // ---------- add / annotate (auto mode: click = point, long-press+drag = box) ----------
  function addAnnotation(data){
    pushHistory();
    const id=nextId++;
    const a=Object.assign({id}, data);
    annotations.push(a);
    render(); renderList();
    return a;
  }
  function pointAt(e){
    const pt=eventToCanvas(e);
    const a=addAnnotation({type:'point', x:pt.x, y:pt.y, w:0, h:0, text:''});
    selectedAnnotationId=a.id;
    focusInput(a.id);
  }
  function finishBox(){
    if(!dragState) return;
    let{startX,startY,dx,dy}=dragState;
    const x=Math.min(startX,dx), y=Math.min(startY,dy);
    const w=Math.abs(dx-startX), h=Math.abs(dy-startY);
    // remove draft elements
    if(draftRect){ overlay.removeChild(draftRect); draftRect=null; }
    if(draftLabel){ overlay.removeChild(draftLabel); draftLabel=null; }
    const a=addAnnotation({type:'box', x, y, w, h, text:''});
    selectedAnnotationId=a.id;
    dragState=null;
    focusInput(a.id);
  }

  function focusInput(id){
    const el=document.querySelector(`.item input[data-id="${id}"]`);
    if(el){ el.focus(); el.select(); }
  }

  // ---------- inline edit annotation text on canvas ----------
  let editAnnotationId=null;
  function showEditInput(a, e){
    if(editAnnotationId!==null) hideEditInput();
    editAnnotationId=a.id;
    editInput.value=a.text||'';
    const pt=canvasToStage(a.type==='point'?a.x:a.x+a.w/2, a.type==='point'?a.y:a.y-8);
    const r=stageWrap.getBoundingClientRect();
    editInput.style.display='block';
    editInput.style.left=(pt.sx-r.left)+'px';
    editInput.style.top=(pt.sy-r.top)+'px';
    editInput.focus();
    editInput.select();
  }
  function hideEditInput(){
    if(editAnnotationId===null) return;
    const a=annotations.find(x=>x.id===editAnnotationId);
    if(a){ a.text=editInput.value; render(); renderList(); updateOutput(); }
    editAnnotationId=null;
    editInput.style.display='none';
    editInput.value='';
  }
  editInput.onblur=()=>{ hideEditInput(); };
  editInput.onkeydown=e=>{
    if(e.key==='Enter'){ hideEditInput(); }
    if(e.key==='Escape'){ hideEditInput(); }
    e.stopPropagation();
  };
  // double-click on overlay to edit annotation
  overlay.addEventListener('dblclick', e=>{
    if(!img) return;
    const pt=eventToCanvas(e);
    for(const a of annotations){
      if(a.type==='point'){
        const d=Math.hypot(pt.x-a.x, pt.y-a.y);
        if(d<8/scale){ showEditInput(a, e); return; }
      } else {
        if(pt.x>=a.x && pt.x<=a.x+a.w && pt.y>=a.y && pt.y<=a.y+a.h){
          showEditInput(a, e); return;
        }
      }
    }
  });
  // hide edit input on canvas click
  overlay.addEventListener('click', e=>{
    if(editAnnotationId!==null){
      // check if we clicked on the edit annotation itself
      const pt=eventToCanvas(e);
      const a=annotations.find(x=>x.id===editAnnotationId);
      if(a){
        let hit=false;
        if(a.type==='point'){ hit=Math.hypot(pt.x-a.x, pt.y-a.y)<8/scale; }
        else { hit=pt.x>=a.x&&pt.x<=a.x+a.w&&pt.y>=a.y&&pt.y<=a.y+a.h; }
        if(!hit) hideEditInput();
      }
    }
    if(!img) return;
    const pt=eventToCanvas(e);
    // find annotation near click
    for(const a of annotations){
      if(a.type==='point'){
        const d=Math.hypot(pt.x-a.x, pt.y-a.y);
        if(d<8/scale){ selectAnnotation(a.id); return; }
      } else {
        if(pt.x>=a.x && pt.x<=a.x+a.w && pt.y>=a.y && pt.y<=a.y+a.h){
          selectAnnotation(a.id); return;
        }
      }
    }
    // click on empty area → deselect
    clearSelection();
  });
  stageInner.addEventListener('mousemove', e=>{
    moveMagnifier(e);
    if(dragState && dragState.active){
      const pt=eventToCanvas(e);
      dragState.dx=pt.x; dragState.dy=pt.y;
      updateDraft();
    }
  });
  stageInner.addEventListener('mousedown', e=>{
    if(!img) return;
    e.preventDefault();
    const pt=eventToCanvas(e);
    dragState={startX:pt.x, startY:pt.y, dx:pt.x, dy:pt.y, startTime:Date.now(), active:false};
  });
  window.addEventListener('mousemove', e=>{
    // check if we need to promote to box drag
    if(dragState && !dragState.active && img){
      const pt=eventToCanvas(e);
      const dx=Math.abs(pt.x-dragState.startX), dy=Math.abs(pt.y-dragState.startY);
      const elapsed=Date.now()-dragState.startTime;
      if(dx>DRAG_THRESHOLD || dy>DRAG_THRESHOLD){
        dragState.active=true;
        dragState.dx=pt.x; dragState.dy=pt.y;
        magnifier.style.display='none';
        // create draft rect
        const rect=document.createElementNS(NS,'rect');
        rect.setAttribute('fill','rgba(110,231,160,.15)');
        rect.setAttribute('stroke','#6ee7a0'); rect.setAttribute('stroke-width','1.5');
        rect.setAttribute('stroke-dasharray','4 3');
        overlay.appendChild(rect);
        draftRect=rect;
        // create draft label
        const lblG=document.createElementNS(NS,'g');
        const lbl=document.createElementNS(NS,'text');
        lbl.setAttribute('fill','#fff'); lbl.setAttribute('font-size','14');
        lbl.setAttribute('font-weight','600');
        overlay.appendChild(lblG);
        draftLabel=lblG;
        updateDraft();
      }
    }
  });
  window.addEventListener('mouseup', e=>{
    if(!dragState) return;
    if(dragState.active){
      // box drag completed
      finishBox();
    } else {
      // short click → point
      const elapsed=Date.now()-dragState.startTime;
      if(elapsed<CLICK_MAX_MS){
        pointAt(e);
      }
      dragState=null;
    }
  });
  stageInner.addEventListener('mouseleave', hideMagnifier);

  function updateDraft(){
    if(!draftRect||!dragState) return;
    let dx=dragState.dx, dy=dragState.dy;
    // Shift snapping: lock square / horizontal / vertical proportion
    if(snappingActive){
      const ax=Math.abs(dx-dragState.startX), ay=Math.abs(dy-dragState.startY);
      if(ax>0 && ay>0){
        if(ay<ax*0.3){ dy=dragState.startY; }        // horizontal line
        else if(ax<ay*0.3){ dx=dragState.startX; }   // vertical line
        else { const s=Math.max(ax,ay);               // square
          dx=dragState.startX + (dx>=dragState.startX?s:-s);
          dy=dragState.startY + (dy>=dragState.startY?s:-s);
        }
      }
    }
    let x=Math.min(dragState.startX,dx), y=Math.min(dragState.startY,dy);
    let w=Math.abs(dx-dragState.startX), h=Math.abs(dy-dragState.startY);
    draftRect.setAttribute('x',x); draftRect.setAttribute('y',y);
    draftRect.setAttribute('width',w); draftRect.setAttribute('height',h);
    if(draftLabel){
      draftLabel.innerHTML='';
      const labelText=`${Math.round(w)} × ${Math.round(h)}`;
      // build pill inside the <g>
      const t=document.createElementNS(NS,'text');
      const fs=14;
      t.setAttribute('font-size',fs);
      t.setAttribute('font-weight','600');
      t.setAttribute('fill','#fff');
      const lx=x+w, ly=y;
      t.setAttribute('x',lx-4);
      t.setAttribute('y',Math.max(20,ly-4));
      t.setAttribute('text-anchor','end');
      t.textContent=labelText;
      draftLabel.appendChild(t);
      // measure and draw pill bg
      const bb=t.getBBox();
      const pad=4;
      const r=document.createElementNS(NS,'rect');
      r.setAttribute('x',bb.x-pad); r.setAttribute('y',bb.y-pad);
      r.setAttribute('width',bb.width+pad*2); r.setAttribute('height',bb.height+pad*2);
      r.setAttribute('rx',5); r.setAttribute('ry',5);
      r.setAttribute('fill','rgba(110,231,160,.92)');
      r.setAttribute('stroke','rgba(0,0,0,.6)'); r.setAttribute('stroke-width','1');
      draftLabel.insertBefore(r, t);
    }
  }

  // drag to move image when zoomed? skip for simplicity

  // ---------- numeric formatting ----------
  function fmt(v){
    const p=2;
    let s=Number(v).toFixed(p);
    return s;
  }

  // ---------- list rendering ----------
  function buildItem(a, i, t){
    const div=document.createElement('div');
    div.className='item'+(a.id===selectedAnnotationId?' sel':'');
    div.onclick=()=>{ selectAnnotation(a.id); };
    // line
    const line=document.createElement('div'); line.className='line';
    const badge=document.createElement('span');
    badge.className='badge '+(a.type==='point'?'point':'box');
    badge.textContent=(a.type==='point'?t.pointBadge:t.boxBadge)+' '+(i+1);
    const coords=document.createElement('span'); coords.className='coords';
    coords.textContent=coordText(a);
    const del=document.createElement('button'); del.className='del'; del.textContent='✕';
    del.title='删除';
    del.onclick=()=>{removeAnnotation(a.id)};
    line.append(badge, coords, del);
    // text input
    const input=document.createElement('input');
    input.type='text'; input.dataset.id=a.id;
    input.placeholder=t.inputPlaceholder;
    input.value=a.text||'';
    input.oninput=()=>{a.text=input.value; render(); updateOutput();};
    const meta=document.createElement('div'); meta.className='meta';
    meta.textContent=metaText(a);
    div.append(line,input,meta);
    return div;
  }
  function groupHeader(title, count){
    const h=document.createElement('div');
    h.className='group-head';
    const s=document.createElement('span'); s.className='gtitle'; s.textContent=title;
    const c=document.createElement('span'); c.className='gcount'; c.textContent=count;
    h.append(s,c);
    return h;
  }
  function renderList(){
    listEl.innerHTML='';
    countEl.textContent=annotations.length;
    if(!annotations.length){
      listEl.innerHTML='<div class="empty">'+i18n[currentLang].emptyList+'</div>';
      updateOutput();
      return;
    }
    const t=i18n[currentLang];
    if(groupingMode==='type'){
      // group by type: point / box
      [['point',t.pointBadge],['box',t.boxBadge]].forEach(([type,title])=>{
        const items=annotations.map((a,i)=>[a,i]).filter(([a])=>a.type===type);
        if(!items.length) return;
        listEl.appendChild(groupHeader(title, items.length));
        items.forEach(([a,i])=>listEl.appendChild(buildItem(a,i,t)));
      });
    } else {
      // no grouping - flat list
      annotations.forEach((a,i)=>listEl.appendChild(buildItem(a,i,t)));
    }
    updateOutput();
  }

  function coordText(a){
    if(a.type==='point'){
      return `x=${fmt(a.x/img.naturalWidth*100)}%, y=${fmt(a.y/img.naturalHeight*100)}%`;
    } else {
      return `(${fmt(a.x/img.naturalWidth*100)}%, ${fmt(a.y/img.naturalHeight*100)}%) → (${fmt((a.x+a.w)/img.naturalWidth*100)}%, ${fmt((a.y+a.h)/img.naturalHeight*100)}%)  [${Math.round(a.w)}×${Math.round(a.h)}px]`;
    }
  }
  function metaText(a){
    if(a.type==='point'){
      return `像素: (${Math.round(a.x)}, ${Math.round(a.y)})`;
    } else {
      return `像素: (${Math.round(a.x)}, ${Math.round(a.y)}) → (${Math.round(a.x+a.w)}, ${Math.round(a.y+a.h)}) · ${Math.round(a.w)}×${Math.round(a.h)}px`;
    }
  }

  function removeAnnotation(id){
    pushHistory();
    if(selectedAnnotationId===id) selectedAnnotationId=null;
    annotations=annotations.filter(a=>a.id!==id);
    render(); renderList();
  }

  // ---------- selection ----------
  function selectAnnotation(id){
    selectedAnnotationId=(selectedAnnotationId===id)?null:id;
    render(); renderList();
  }
  function getSelectedAnnotation(){
    return annotations.find(a=>a.id===selectedAnnotationId)||null;
  }
  function clearSelection(){
    if(!selectedAnnotationId) return;
    selectedAnnotationId=null;
    render(); renderList();
  }
  function deleteSelected(){
    if(selectedAnnotationId===null) return;
    // if input is focused, don't delete
    const tag=document.activeElement&&document.activeElement.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    removeAnnotation(selectedAnnotationId);
  }
  function copySelected(){
    const a=getSelectedAnnotation();
    if(!a){ toastMsg(i18n[currentLang].noSelection); return; }
    const W=img.naturalWidth, H=img.naturalHeight;
    let txt;
    if(a.type==='point'){
      txt=`${Math.round(a.x)}px, ${Math.round(a.y)}px (${fmt(a.x/W*100)}%, ${fmt(a.y/H*100)}%)`;
    } else {
      txt=`${Math.round(a.x)}px,${Math.round(a.y)}px → ${Math.round(a.x+a.w)}px,${Math.round(a.y+a.h)}px`;
    }
    navigator.clipboard.writeText(txt).then(()=>toastMsg(i18n[currentLang].copySelectedOK)).catch(()=>{});
  }
  function cancelDragOrSelection(){
    if(dragState){
      if(draftRect){ overlay.removeChild(draftRect); draftRect=null; }
      if(draftLabel){ overlay.removeChild(draftLabel); draftLabel=null; }
      dragState=null;
    }
    clearSelection();
  }
  function clearAll(){
    pushHistory();
    selectedAnnotationId=null;
    annotations=[]; nextId=1;
    render(); renderList();
  }

  // ---------- output (multi-format) ----------
  let outputFormat='text';
  function updateOutput(){
    if(!img){ output.value=''; return; }
    const W=img.naturalWidth, H=img.naturalHeight;
    const t=i18n[currentLang];
    switch(outputFormat){
      case 'json': output.value=jsonOutput(W,H,t); break;
      case 'svg': output.value=svgOutput(W,H); break;
      case 'comfy': output.value=comfyOutput(W,H,t); break;
      case 'coco': output.value=cocoOutput(W,H); break;
      default: output.value=textOutput(W,H,t); break;
    }
  }
  function textOutput(W,H,t){
    const lines=[];
    annotations.forEach((a,i)=>{
      const label=a.text && a.text.trim() ? a.text.trim() : `${t.labelDefault}${i+1}`;
      if(a.type==='point'){
        if(mode==='pct'){
          lines.push(`${i+1}. x=${fmt(a.x/W*100)}%, y=${fmt(a.y/H*100)}% : ${label}`);
        } else {
          lines.push(`${i+1}. x=${Math.round(a.x)}px, y=${Math.round(a.y)}px (${fmt(a.x/W*100)}%, ${fmt(a.y/H*100)}%) : ${label}`);
        }
      } else {
        const x1=fmt(a.x/W*100), y1=fmt(a.y/H*100);
        const x2=fmt((a.x+a.w)/W*100), y2=fmt((a.y+a.h)/H*100);
        if(mode==='pct'){
          lines.push(`${i+1}. x=${x1}%, y=${y1}% to x=${x2}%, y=${y2}% : ${label}`);
        } else {
          lines.push(`${i+1}. x=${Math.round(a.x)}px, y=${Math.round(a.y)}px to x=${Math.round(a.x+a.w)}px, y=${Math.round(a.y+a.h)}px (${x1}%,${y1}% → ${x2}%,${y2}%) : ${label}`);
        }
      }
    });
    return lines.join('\n');
  }
  function jsonOutput(W,H){
    const data={imageWidth:W,imageHeight:H,annotations:annotations.map(a=>({
      type:a.type, x:Math.round(a.x), y:Math.round(a.y),
      w:a.type==='box'?Math.round(a.w):0, h:a.type==='box'?Math.round(a.h):0,
      text:a.text||''
    }))};
    return JSON.stringify(data,null,2);
  }
  function svgOutput(W,H){
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">\n`;
    svg+=`<rect width="${W}" height="${H}" fill="#fff"/>\n`;
    annotations.forEach((a,i)=>{
      if(a.type==='point'){
        svg+=`<circle cx="${Math.round(a.x)}" cy="${Math.round(a.y)}" r="4.5" fill="#ff4d6d" stroke="#fff" stroke-width="1.5"/>\n`;
        svg+=`<text x="${Math.round(a.x+8)}" y="${Math.round(a.y+16)}" font-size="16" font-weight="600" fill="#000">#${a.id}</text>\n`;
      } else {
        svg+=`<rect x="${Math.round(a.x)}" y="${Math.round(a.y)}" width="${Math.round(a.w)}" height="${Math.round(a.h)}" fill="rgba(110,231,160,.15)" stroke="#6ee7a0" stroke-width="1.5"/>\n`;
        svg+=`<text x="${Math.round(a.x)}" y="${Math.max(20,Math.round(a.y-8))}" font-size="16" font-weight="600" fill="#000">#${a.id}</text>\n`;
      }
    });
    svg+=`</svg>`;
    return svg;
  }
  function comfyOutput(W,H,t){
    const lines=[];
    annotations.forEach((a,i)=>{
      const label=a.text && a.text.trim() ? a.text.trim() : `${t.labelDefault}${i+1}`;
      if(a.type==='point'){
        lines.push(`[${label}] x=${fmt(a.x/W*100)}%, y=${fmt(a.y/H*100)}%`);
      } else {
        lines.push(`[${label}] x=${fmt(a.x/W*100)}%, y=${fmt(a.y/H*100)}%, w=${fmt(a.w/W*100)}%, h=${fmt(a.h/H*100)}%`);
      }
    });
    return lines.join('\n');
  }
  function cocoOutput(W,H){
    const coco={
      info:{description:'ImgCoordPicker export', version:'1.0'},
      images:[{id:1, width:W, height:H, file_name:getCurrentImage()?getCurrentImage().name:'image'}],
      annotations:annotations.map((a,i)=>({
        id:i+1, image_id:1, category_id:1,
        bbox:a.type==='box'?[Math.round(a.x),Math.round(a.y),Math.round(a.w),Math.round(a.h)]:[Math.round(a.x),Math.round(a.y),0,0],
        area:a.type==='box'?Math.round(a.w*a.h):0,
        iscrowd:0
      })),
      categories:[{id:1, name:'object'}]
    };
    return JSON.stringify(coco,null,2);
  }

  // ---------- copy ----------
  $('copyBtn').onclick=async()=>{
    const t=i18n[currentLang];
    if(!output.value){ toastMsg(t.noContent); return; }
    try{
      await navigator.clipboard.writeText(output.value);
      toastMsg(t.copyOK);
    }catch(e){
      output.select();
      document.execCommand('copy');
      toastMsg(t.copyCompat);
    }
  };

  // ---------- manual add ----------
  $('addManualBtn').onclick=()=>{
    if(!img){ toastMsg(i18n[currentLang].dropFile); return; }
    const type='point';
    const a=addAnnotation({type, x:img.naturalWidth/2, y:img.naturalHeight/2, w:0, h:0, text:''});
    focusInput(a.id);
    toastMsg(i18n[currentLang].addManualToast);
  };
  $('clearBtn').onclick=()=>{ clearAll(); toastMsg(i18n[currentLang].clearToast); };
  resetBtn.onclick=()=>{ clearAll(); };

  // ---------- export / import ----------
  $('exportBtn').onclick=()=>{
    if(!img||!annotations.length){ toastMsg(i18n[currentLang].noContent); return; }
    const data=jsonOutput(img.naturalWidth, img.naturalHeight);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=(getCurrentImage()?getCurrentImage().name:'annotations')+'_annotations.json';
    a.click(); URL.revokeObjectURL(url);
    toastMsg(i18n[currentLang].exportOK);
  };
  $('importBtn').onclick=()=>{ $('importInput').click(); };
  $('importInput').onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.annotations||!Array.isArray(data.annotations)) throw new Error('invalid');
        pushHistory();
        data.annotations.forEach(a=>{
          if(a.type==='point'||a.type==='box'){
            annotations.push({id:nextId++, type:a.type, x:a.x, y:a.y, w:a.w||0, h:a.h||0, text:a.text||''});
          }
        });
        render(); renderList(); updateOutput();
        toastMsg(i18n[currentLang].importOK);
      }catch(e){
        toastMsg(i18n[currentLang].importFail);
      }
    };
    reader.readAsText(file);
    e.target.value='';
  };
  // format selector
  $('formatSel').onchange=()=>{
    outputFormat=$('formatSel').value;
    updateOutput();
  };

  // ---------- tools / mode ----------
  // theme toggle
  let darkTheme=localStorage.getItem('imgcoord_theme')!=='light';
  const themeBtn=$('themeBtn');
  function applyTheme(){
    document.documentElement.classList.toggle('light', !darkTheme);
  }
  applyTheme();
  themeBtn.onclick=()=>{
    darkTheme=!darkTheme;
    localStorage.setItem('imgcoord_theme', darkTheme?'dark':'light');
    applyTheme();
  };
  // Auto mode: single click → point, long-press + drag → box
  toolAuto.classList.add('active');
  toolHint.textContent='单击＝点选 · 长按拖动＝框选';
  fitBtn.onclick=()=>{ fitToView(); toastMsg(i18n[currentLang].fitToast); };
  $('thumbsToggle').onclick=()=>{
    thumbsCollapsed=!thumbsCollapsed;
    $('thumbsPanel').classList.toggle('collapsed', thumbsCollapsed);
    $('thumbsToggle').textContent=thumbsCollapsed?'▶':'◀';
  };
  $('gridToggle').onclick=()=>{
    showGrid=!showGrid;
    $('gridToggle').classList.toggle('active', showGrid);
    render();
  };
  // grouping toggle
  $('groupSeg').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      $('groupSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      groupingMode=b.dataset.group;
      renderList();
    };
  });
  // shift key snapping
  document.addEventListener('keydown', e=>{
    if(e.key==='Shift'){ snappingActive=true; }
  });
  document.addEventListener('keyup', e=>{
    if(e.key==='Shift'){ snappingActive=false; }
  });
  modeSeg.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      modeSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      mode=b.dataset.mode;
      renderList();
      toastMsg(mode==='pct'?i18n[currentLang].modePct:i18n[currentLang].modeBoth);
    };
  });

  // keyboard shortcuts
  document.addEventListener('keydown', e=>{
    const tag=document.activeElement&&document.activeElement.tagName;
    const typing=(tag==='INPUT'||tag==='TEXTAREA');
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
      return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){
      e.preventDefault(); redo(); return;
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='c' && !typing && selectedAnnotationId!==null){
      e.preventDefault(); copySelected(); return;
    }
    if((e.key==='Delete'||e.key==='Backspace') && !typing){
      e.preventDefault(); deleteSelected(); return;
    }
    if(e.key==='Escape'){
      cancelDragOrSelection();
    }
  });

  // toast
  let toastTimer;
  function toastMsg(m){
    toast.textContent=m; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
  }

  // ---------- i18n ----------
  const i18n={
    zh:{
      title:'图片坐标拾取工具',
      hintTop:'点选 / 框选 · 像素 + 百分比输出',
      upload:'📁 上传图片',
      reset:'🗑️ 清空标注',
      autoMode:'自动模式',
      pct:'百分比',
      both:'像素+百分比',
      hintTool:'单击＝点选 · 长按拖动＝框选',
      fitBtn:'⤢ 适应',
      zoomHint:'缩放：Ctrl+滚轮',
      listTitle:'标注列表',
      addManual:'➕ 手动添加',
      copy:'📋 复制结果',
      clear:'🧹 清空',
      outputPlaceholder:'输出结果将显示在这里…',
      emptyList:'暂无标注。<br>点击图片「点选」，或拖动「框选」。',
      inputPlaceholder:'输入提示词 / 文字…',
      labelDefault:'标注',
      copyOK:'已复制到剪贴板 ✅',
      copyCompat:'已复制（兼容方式）✅',
      noContent:'没有可复制的内容',
      loadSuccess:'图片加载成功：',
      fitToast:'已适应窗口',
      modePct:'输出模式：百分比',
      modeBoth:'输出模式：像素 + 百分比',
      addManualToast:'已添加默认点选，可点击输入文字',
      clearToast:'已清空全部标注',
      initToast:'👆 点击「上传图片」开始',
      dropFile:'请拖入图片文件',
      zoomPct:'百分比',
      zoomBoth:'像素+百分比',
      pointBadge:'点选',
      boxBadge:'框选',

      magCoord:'',
      thumbsTitle:'📷 图集',
      cantRemoveLast:'至少保留一张图片',
      noUndo:'没有可撤销的操作',
      noRedo:'没有可重做的操作',
      undoToast:'↩ 已撤销',
      redoToast:'↪ 已重做',
      noSelection:'请先选中一个标注',
      copySelectedOK:'已复制选中坐标 ✅',
      grid:'⧉ 网格',
      groupLabel:'分组：',
      groupNone:'不分组',
      groupType:'按类型分组',
      noLabel:'未标注',
      export:'导出 JSON',
      import:'导入 JSON',
      exportOK:'✅ 已导出标注数据',
      importOK:'✅ 已导入标注数据',
      importFail:'❌ 导入失败，文件格式无效',
      formatLabel:'格式：',
      fmtText:'📄 文本',
      fmtJson:'🧩 JSON',
      fmtSvg:'🖼️ SVG',
      fmtComfy:'🤖 ComfyUI/SD',
      fmtCoco:'🎯 COCO'
    },
    en:{
      title:'Image Coord Picker',
      hintTop:'Point / Box · Pixel + Percentage Output',
      upload:'📁 Upload Image',
      reset:'🗑️ Clear All',
      autoMode:'Auto Mode',
      pct:'Percentage',
      both:'Pixel+Percent',
      hintTool:'Click = Point · Long-press+drag = Box',
      fitBtn:'⤢ Fit',
      zoomHint:'Zoom: Ctrl+Scroll',
      listTitle:'Annotations',
      addManual:'➕ Add Manual',
      copy:'📋 Copy Result',
      clear:'🧹 Clear',
      outputPlaceholder:'Output will appear here…',
      emptyList:'No annotations yet.<br>Click to add a point, or drag to select a box.',
      inputPlaceholder:'Enter prompt / text…',
      labelDefault:'Anno',
      copyOK:'Copied to clipboard ✅',
      copyCompat:'Copied (fallback) ✅',
      noContent:'Nothing to copy',
      loadSuccess:'Image loaded: ',
      fitToast:'Fitted to window',
      modePct:'Output mode: Percentage',
      modeBoth:'Output mode: Pixel + Percentage',
      addManualToast:'Default point added, click to edit text',
      clearToast:'All annotations cleared',
      initToast:'👆 Click "Upload Image" to start',
      dropFile:'Please drop an image file',
      zoomPct:'Percentage',
      zoomBoth:'Pixel+Percent',

      boxBadge:'Box',
      metaPx:'Pixel',
      magCoord:'',
      thumbsTitle:'📷 Gallery',
      cantRemoveLast:'Keep at least one image',
      noUndo:'Nothing to undo',
      noRedo:'Nothing to redo',
      undoToast:'↩ Undo',
      redoToast:'↪ Redo',
      noSelection:'Select an annotation first',
      copySelectedOK:'✅ Copied selected coords',
      grid:'⧉ Grid',
      groupLabel:'Group:',
      groupNone:'None',
      groupType:'By Type',
      noLabel:'No Label',
      export:'Export JSON',
      import:'Import JSON',
      exportOK:'✅ Annotations exported',
      importOK:'✅ Annotations imported',
      importFail:'❌ Import failed, invalid file',
      formatLabel:'Format:',
      fmtText:'📄 Text',
      fmtJson:'🧩 JSON',
      fmtSvg:'🖼️ SVG',
      fmtComfy:'🤖 ComfyUI/SD',
      fmtCoco:'🎯 COCO'
    }
  };
  let currentLang='zh';
  function applyLang(lang){
    currentLang=lang;
    const t=i18n[lang];
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key=el.dataset.i18n;
      if(t[key]!==undefined){
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){
          el.placeholder=t[key];
        } else {
          el.innerHTML=t[key];
        }
      }
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
      const key=el.dataset.i18nPlaceholder;
      if(t[key]!==undefined) el.placeholder=t[key];
    });
    // update dynamic texts
    renderList();
  }
  $('langSel').onchange=()=>{ applyLang($('langSel').value); };

  // init
  renderList();
  toastMsg(i18n[currentLang].initToast);
})();
</script>
